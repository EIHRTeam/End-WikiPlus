name: Setup Android Build Environment
description: Prepare Java, Gradle, and Android SDK dependencies for Tauri Android builds.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "21"
  java-distribution:
    description: Java distribution to install.
    required: false
    default: "temurin"
  android-platform:
    description: Android platform API level to install.
    required: false
    default: "36"
  build-tools:
    description: Android build tools version to install.
    required: false
    default: "36.0.0"
  ndk-version:
    description: Android NDK version to install.
    required: false
    default: "29.0.14206865"
  gradle-cache-encryption-key:
    description: Optional Gradle cache encryption key used to persist configuration-cache state safely.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Shared source of truth for Android CI setup. Workflows should consume this
    # action instead of re-declaring Java/Gradle/SDK installation inline.
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        # Release workflows are manually dispatched and often run from a
        # long-lived release branch, so allow them to refresh the shared
        # Gradle cache instead of staying read-only off the default branch.
        cache-read-only: false
        # If the repository defines GRADLE_ENCRYPTION_KEY, setup-gradle can
        # safely persist the configuration-cache enabled in gradle.properties.
        cache-encryption-key: ${{ inputs.gradle-cache-encryption-key }}

    - name: Verify Java and Gradle wrapper versions
      shell: bash
      run: |
        set -euo pipefail
        java -version
        ./src-tauri/gen/android/gradlew --version

    - name: Install Android dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y unzip
        wget https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O cmdline-tools.zip
        mkdir -p "$HOME/android-sdk/cmdline-tools"
        unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
        rm -f cmdline-tools.zip
        rm -rf "$HOME/android-sdk/cmdline-tools/latest"
        mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
        # sdkmanager exits once all prompts are answered, which leaves `yes`
        # with SIGPIPE; disable pipefail so that only sdkmanager decides success.
        set +o pipefail
        yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses
        set -o pipefail
        "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
          --sdk_root="$HOME/android-sdk" \
          "platform-tools" \
          "platforms;android-${{ inputs.android-platform }}" \
          "build-tools;${{ inputs.build-tools }}" \
          "ndk;${{ inputs.ndk-version }}"

    - name: Export Android environment
      shell: bash
      run: |
        set -euo pipefail
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
        echo "NDK_HOME=$HOME/android-sdk/ndk/${{ inputs.ndk-version }}" >> "$GITHUB_ENV"
        echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
