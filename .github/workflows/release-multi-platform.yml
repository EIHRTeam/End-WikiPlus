name: Release Build Multi Platform

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. 1.0.0, 1.0.0-alpha, 1.0.0-rc1) (no leading 'v')"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PNPM_VERSION: '9'

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Manage Tag and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Processing tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists, deleting..."
            gh release delete "$TAG_NAME" --yes || true
          fi

          if git ls-remote --exit-code --tags origin "$TAG_NAME" >/dev/null 2>&1; then
            echo "Remote tag $TAG_NAME exists, deleting..."
            git push origin --delete "$TAG_NAME" || true
          fi

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Local tag $TAG_NAME exists, deleting..."
            git tag -d "$TAG_NAME" || true
          fi

          echo "Creating tag $TAG_NAME on commit ${{ github.sha }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Creating draft GitHub Release $TAG_NAME ..."
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file .github/workflows/release.md --draft

  build-and-release:
    needs: create-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
            rust_target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: linux
            rust_target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04
            target: android
            rust_target: aarch64-linux-android
          - platform: macos-14
            target: macos
            rust_target: aarch64-apple-darwin
          - platform: macos-14
            target: ios
            rust_target: aarch64-apple-ios

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          $store = pnpm store path
          "PNPM_STORE_PATH=$store" >> $env:GITHUB_ENV
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.target }}-
            ${{ runner.os }}-pnpm-

      # Android CI toolchain setup is centralized in .github/actions.
      - name: Setup Android build environment
        if: matrix.target == 'android'
        uses: ./.github/actions/setup-android-build-env

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Decode Keystore (Android release signing)
        if: matrix.target == 'android'
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ENCODED_STRING:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/src-tauri/gen/android/app/release.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          echo "$ENCODED_STRING" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          ls -la "$KEYSTORE_PATH"

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync iOS version from tauri.conf.json
        if: matrix.target == 'ios'
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" src-tauri/gen/apple/app_iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" src-tauri/gen/apple/app_iOS/Info.plist
          perl -0pi -e 's/CFBundleShortVersionString: .*/CFBundleShortVersionString: '"$VERSION"'/; s/CFBundleVersion: "[^"]+"/CFBundleVersion: "'"$VERSION"'"/;' src-tauri/gen/apple/project.yml

      - name: Disable iOS code signing for unsigned build
        if: matrix.target == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/apple/app.xcodeproj/project.pbxproj")
          lines = path.read_text().splitlines()

          signing_keys = {
              "CODE_SIGN_STYLE =",
              "CODE_SIGNING_ALLOWED =",
              "CODE_SIGNING_REQUIRED =",
              "CODE_SIGN_IDENTITY =",
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" =',
              "DEVELOPMENT_TEAM =",
              '"DEVELOPMENT_TEAM[sdk=iphoneos*]" =',
              "PROVISIONING_PROFILE_SPECIFIER =",
              '"PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]" =',
          }

          injected = False
          output = []
          for line in lines:
              stripped = line.strip()
              if any(stripped.startswith(key) for key in signing_keys):
                  continue

              output.append(line)
              if stripped == "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;":
                  indent = line[: len(line) - len(line.lstrip())]
                  output.extend(
                      [
                          f"{indent}CODE_SIGN_STYLE = Manual;",
                          f"{indent}CODE_SIGNING_ALLOWED = NO;",
                          f"{indent}CODE_SIGNING_REQUIRED = NO;",
                          f'{indent}CODE_SIGN_IDENTITY = "";',
                          f'{indent}"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";',
                          f'{indent}DEVELOPMENT_TEAM = "";',
                          f'{indent}"DEVELOPMENT_TEAM[sdk=iphoneos*]" = "";',
                          f'{indent}PROVISIONING_PROFILE_SPECIFIER = "";',
                          f'{indent}"PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]" = "";',
                      ]
                  )
                  injected = True

          if not injected:
              raise SystemExit("Failed to locate iOS build settings block in project.pbxproj")

          path.write_text("\n".join(output) + "\n")
          PY
          grep -nE 'objectVersion|compatibilityVersion|preferredProjectObjectVersion' src-tauri/gen/apple/app.xcodeproj/project.pbxproj || true
          if command -v rg >/dev/null 2>&1; then
            rg -n 'CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER' src-tauri/gen/apple/app.xcodeproj/project.pbxproj
          else
            grep -nE 'CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER' src-tauri/gen/apple/app.xcodeproj/project.pbxproj
          fi

      - name: Build Windows x64
        if: matrix.target == 'windows'
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Prepare Windows Asset
        if: matrix.target == 'windows'
        id: prepare_windows_asset
        shell: pwsh
        run: |
          $VERSION = "${{ steps.get_version.outputs.VERSION }}"
          $exePath = "src-tauri/target/x86_64-pc-windows-msvc/release/app.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Could not find Windows app binary at $exePath"
            exit 1
          }

          $newExe = "EndWikiplus-x64-portable-$VERSION.exe"
          Copy-Item $exePath $newExe -Force
          "asset_path=$newExe" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Artifact
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ steps.get_version.outputs.VERSION }}
          path: ${{ steps.prepare_windows_asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload Windows Release Asset
        if: matrix.target == 'windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" "${{ steps.prepare_windows_asset.outputs.asset_path }}" --clobber

      - name: Build Linux x64 (deb)
        if: matrix.target == 'linux'
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb

      - name: Prepare Linux Asset
        if: matrix.target == 'linux'
        id: prepare_linux_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          OLD_DEB=$(ls src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb | head -n 1)
          NEW_DEB="EndWikiplus-x64-$VERSION.deb"
          mv "$OLD_DEB" "$NEW_DEB"
          echo "asset_path=$NEW_DEB" >> "$GITHUB_OUTPUT"

      - name: Upload Linux Artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ steps.get_version.outputs.VERSION }}
          path: ${{ steps.prepare_linux_asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload Linux Release Asset
        if: matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" "${{ steps.prepare_linux_asset.outputs.asset_path }}" --clobber

      - name: Build Android arm64-v8a
        if: matrix.target == 'android'
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/app/release.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri android build --target aarch64 --apk

      - name: Prepare Android Asset
        if: matrix.target == 'android'
        id: prepare_android_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          OLD_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "${OLD_APK:-}" ]; then
            echo "No release APK found under outputs/apk/"
            find src-tauri/gen/android/app/build/outputs/apk/ -maxdepth 4 -type f -name "*.apk" -print || true
            exit 1
          fi
          NEW_APK="EndWikiplus-arm64v8a-$VERSION.apk"
          mv "$OLD_APK" "$NEW_APK"
          echo "asset_path=$NEW_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android Artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: release-android-${{ steps.get_version.outputs.VERSION }}
          path: ${{ steps.prepare_android_asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload Android Release Asset
        if: matrix.target == 'android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" "${{ steps.prepare_android_asset.outputs.asset_path }}" --clobber

      - name: Build macOS DMG (unsigned, Apple Silicon)
        if: matrix.target == 'macos'
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --no-sign

      - name: Prepare macOS Asset
        if: matrix.target == 'macos'
        id: prepare_macos_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          OLD_DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          NEW_DMG="EndWikiplus-macos-arm64-unsigned-$VERSION.dmg"
          mv "$OLD_DMG" "$NEW_DMG"
          echo "asset_path=$NEW_DMG" >> "$GITHUB_OUTPUT"

      - name: Upload macOS Artifact
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-unsigned-${{ steps.get_version.outputs.VERSION }}
          path: ${{ steps.prepare_macos_asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload macOS Release Asset
        if: matrix.target == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" "${{ steps.prepare_macos_asset.outputs.asset_path }}" --clobber

      - name: Build iOS IPA (unsigned)
        if: matrix.target == 'ios'
        id: build_ios
        shell: bash
        run: |
          set +e
          pnpm tauri ios build --ci --target aarch64 -c src-tauri/tauri.ios.conf.json
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "tauri ios build exited with status $STATUS; checking whether a complete unsigned app bundle can still be packaged."
          fi

      - name: Prepare iOS Asset
        if: matrix.target == 'ios'
        id: prepare_ios_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          NEW_IPA="EndWikiplus-ios-unsigned-$VERSION.ipa"
          REPO_SEARCH_ROOT="src-tauri/gen/apple"
          DERIVED_DATA_ROOT="$HOME/Library/Developer/Xcode/DerivedData"
          OLD_IPA=$(find "$REPO_SEARCH_ROOT" "$DERIVED_DATA_ROOT" -type f -name "*.ipa" 2>/dev/null | head -n 1 || true)

          if [ -n "${OLD_IPA:-}" ]; then
            mv "$OLD_IPA" "$NEW_IPA"
            echo "asset_path=$NEW_IPA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APP_PATH=$(
            find "$REPO_SEARCH_ROOT" -type d -name "*.app" 2>/dev/null | head -n 1 || true
          )
          if [ -z "${APP_PATH:-}" ]; then
            APP_PATH=$(
              find "$DERIVED_DATA_ROOT" -path '*/Build/Products/*-iphoneos/*.app' -type d 2>/dev/null | head -n 1 || true
            )
          fi
          if [ -n "${APP_PATH:-}" ]; then
            APP_INFO_PLIST="$APP_PATH/Info.plist"
            if [ ! -f "$APP_INFO_PLIST" ]; then
              echo "Incomplete iOS app bundle: missing $APP_INFO_PLIST"
              find "$APP_PATH" -maxdepth 2 -print
              exit 1
            fi

            APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_INFO_PLIST" 2>/dev/null || true)
            if [ -z "${APP_EXECUTABLE:-}" ] || [ ! -f "$APP_PATH/$APP_EXECUTABLE" ]; then
              echo "Incomplete iOS app bundle: missing executable ${APP_EXECUTABLE:-<unset>}"
              find "$APP_PATH" -maxdepth 2 -print
              exit 1
            fi

            echo "Packaging unsigned app bundle from $APP_PATH"
            PACKAGE_DIR="$(mktemp -d)"
            mkdir -p "$PACKAGE_DIR/Payload"
            cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"
            (
              cd "$PACKAGE_DIR"
              zip -qry "$GITHUB_WORKSPACE/$NEW_IPA" Payload
            )
            rm -rf "$PACKAGE_DIR"
            echo "asset_path=$NEW_IPA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No .ipa or .app found under $REPO_SEARCH_ROOT or $DERIVED_DATA_ROOT"
          echo "tauri ios build exit code: ${{ steps.build_ios.outputs.exit_code }}"
          find "$REPO_SEARCH_ROOT" "$DERIVED_DATA_ROOT" \( -type f -name "*.ipa" -o -type d -name "*.app" \) -print 2>/dev/null || true
          exit 1

      - name: Upload iOS Artifact
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v7
        with:
          name: release-ios-unsigned-${{ steps.get_version.outputs.VERSION }}
          path: ${{ steps.prepare_ios_asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload iOS Release Asset
        if: matrix.target == 'ios'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" "${{ steps.prepare_ios_asset.outputs.asset_path }}" --clobber

  update-readme:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Update README badge
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          python3 scripts/update_readme_version_badge.py "$TAG_NAME" README.md README_en-US.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md README_en-US.md; then
            echo "No changes in README files"
          else
            git add README.md README_en-US.md
            git commit -m "docs: update version badge to ${{ inputs.tag_name }}"
            git push origin ${{ github.ref_name }}
          fi

  publish-release:
    needs:
      - build-and-release
      - update-readme
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG_NAME" --draft=false --repo "$GH_REPO"
