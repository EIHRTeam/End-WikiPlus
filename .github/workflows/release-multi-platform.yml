name: Release Build Multi Platform

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. 1.0.0, 1.0.0-alpha, 1.0.0-rc1) (no leading 'v')"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PNPM_VERSION: '9'

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Manage Tag and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Processing tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists, deleting..."
            gh release delete "$TAG_NAME" --yes || true
          fi

          if git ls-remote --exit-code --tags origin "$TAG_NAME" >/dev/null 2>&1; then
            echo "Remote tag $TAG_NAME exists, deleting..."
            git push origin --delete "$TAG_NAME" || true
          fi

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Local tag $TAG_NAME exists, deleting..."
            git tag -d "$TAG_NAME" || true
          fi

          echo "Creating tag $TAG_NAME on commit ${{ github.sha }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Creating GitHub Release $TAG_NAME ..."
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes ""

  build-and-release:
    needs: create-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
            rust_target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: linux
            rust_target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04
            target: android
            rust_target: aarch64-linux-android
          - platform: macos-14
            target: macos
            rust_target: aarch64-apple-darwin
          - platform: macos-14
            target: ios
            rust_target: aarch64-apple-ios

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          $store = pnpm store path
          "PNPM_STORE_PATH=$store" >> $env:GITHUB_ENV
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.target }}-
            ${{ runner.os }}-pnpm-

      - name: Setup Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Android dependencies
        if: matrix.target == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O cmdline-tools.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.14206865"

      - name: Set up Android env
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "NDK_HOME=$HOME/android-sdk/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Decode Keystore (Android release signing)
        if: matrix.target == 'android'
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ENCODED_STRING:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/src-tauri/gen/android/app/release.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          echo "$ENCODED_STRING" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          ls -la "$KEYSTORE_PATH"

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows x64
        if: matrix.target == 'windows'
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Prepare Windows Asset
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ steps.get_version.outputs.VERSION }}"
          $exe = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Could not find any .exe under src-tauri/target/x86_64-pc-windows-msvc/release"
            exit 1
          }

          $newExe = "EndWikiplus-x64-portable-$VERSION.exe"
          Copy-Item $exe.FullName $newExe -Force
          gh release upload "${{ inputs.tag_name }}" "$newExe" --clobber

      - name: Build Linux x64 (deb)
        if: matrix.target == 'linux'
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb

      - name: Prepare Linux Asset
        if: matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          OLD_DEB=$(ls src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb | head -n 1)
          NEW_DEB="EndWikiplus-x64-$VERSION.deb"
          mv "$OLD_DEB" "$NEW_DEB"
          gh release upload "${{ inputs.tag_name }}" "$NEW_DEB" --clobber

      - name: Build Android arm64-v8a
        if: matrix.target == 'android'
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/app/release.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri android build --target aarch64 --apk

      - name: Prepare Android Asset
        if: matrix.target == 'android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          OLD_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "${OLD_APK:-}" ]; then
            echo "No release APK found under outputs/apk/"
            find src-tauri/gen/android/app/build/outputs/apk/ -maxdepth 4 -type f -name "*.apk" -print || true
            exit 1
          fi
          NEW_APK="EndWikiplus-arm64v8a-$VERSION.apk"
          mv "$OLD_APK" "$NEW_APK"
          gh release upload "${{ inputs.tag_name }}" "$NEW_APK" --clobber

      - name: Build macOS DMG (Apple Silicon)
        if: matrix.target == 'macos'
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Prepare macOS Asset
        if: matrix.target == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          OLD_DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          NEW_DMG="EndWikiplus-macos-arm64-$VERSION.dmg"
          mv "$OLD_DMG" "$NEW_DMG"
          gh release upload "${{ inputs.tag_name }}" "$NEW_DMG" --clobber

      - name: Build iOS IPA (unsigned)
        if: matrix.target == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/ios-derived"
          xcodebuild \
            -project src-tauri/gen/apple/app.xcodeproj \
            -scheme app_iOS \
            -configuration release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Prepare iOS Asset
        if: matrix.target == 'ios'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DERIVED_DATA="$RUNNER_TEMP/ios-derived"
          APP_PATH=$(find "$DERIVED_DATA/Build/Products/release-iphoneos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [ -z "${APP_PATH:-}" ]; then
            echo "No .app found in $DERIVED_DATA/Build/Products/release-iphoneos"
            ls -la "$DERIVED_DATA/Build/Products" || true
            exit 1
          fi

          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          NEW_IPA="EndWikiplus-ios-unsigned-$VERSION.ipa"
          (
            cd "$RUNNER_TEMP"
            zip -qry "$GITHUB_WORKSPACE/$NEW_IPA" Payload
          )
          gh release upload "${{ inputs.tag_name }}" "$NEW_IPA" --clobber
